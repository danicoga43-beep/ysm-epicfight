name: Build YSM Epic Fight Compat (Fabric)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build
        id: build
        continue-on-error: true
        run: gradle build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Ringkas error
        if: always()
        run: |
          echo "Jumlah error: $(grep -c 'error:' build.log || true)" >> $GITHUB_STEP_SUMMARY
          grep -E 'error:' build.log | sed -E 's#.*/src/main/java/##' | cut -c1-200 | head -60 >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with: { name: ysm-epicfight-compat-jar, path: build/libs/*.jar }
      - if: steps.build.outcome != 'success'
        run: exit 1
