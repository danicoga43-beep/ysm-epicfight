plugins {
    id 'java-library'
    id 'fabric-loom' version '1.12.7'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ysm-epicfight-compat-fabric'
}

def ysmMappingApiDependencyVersion = gradle.ext.ysmMappingApiDependencyVersion

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    mixin {
        // Must match "refmap" in ysm_epicfight_compat.mixins.json.
        defaultRefmapName = 'ysm_epicfight_compat.refmap.json'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Epic Fight Fabric port and Forge Config API Port (NeoForge ModConfigSpec on Fabric).
    modImplementation files("libs/${epicfight_jar}")
    modImplementation files("libs/${fcap_jar}")

    // Only the stable alias API is needed at compile time; the Mapping API mod provides it at runtime.
    compileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"

    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    include 'com.github.luben:zstd-jni:1.5.6-3'
}

processResources {
    def props = [
            mod_id         : mod_id,
            mod_name       : mod_name,
            mod_license    : mod_license,
            mod_version    : mod_version,
            mod_authors    : mod_authors,
            mod_description: mod_description
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
