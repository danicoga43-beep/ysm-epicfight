plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = project.mod_version
group = 'net.okitsu.ysmepicfightcompat'
base { archivesName = 'ysm-epicfight-compat-fabric' }

repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { name = 'Fuzs'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapiport_version}"
    compileOnly "org.jetbrains:annotations:26.0.1"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Epic Fight (port Fabric) dan Fox Model Loader (mod id yes_steve_model): jar ada di folder libs/
    modCompileOnly files(fileTree(dir: 'libs', include: 'epicfight-fabric*.jar'))
    modCompileOnly files(fileTree(dir: 'libs', include: 'fox-model-loader*.jar'))
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
